services:
  - type: web
    name: portfolio-spring-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://akskriitk.github.io
