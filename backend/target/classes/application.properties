# Spring Boot Server Port (supports PORT environment variable for cloud hosts like Render/Railway)
server.port=${PORT:5000}

# Application Name
spring.application.name=portfolio-backend

# Management & Health Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Custom App Configuration Properties
google.sheets.webhook.url=${GOOGLE_SHEETS_WEBHOOK_URL:}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://akskriitk.github.io}

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
